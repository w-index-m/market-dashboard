name: Precompute mode backtests (comparison table)

on:
  schedule:
    - cron: "50 22 * * 1-5"   # 22:50 UTC = 07:50 JST 平日。marks-valuation(22:20)・sp600/jp(17:00)の後
  workflow_dispatch: {}

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        run: pip install -q -r requirements.txt
      - name: Compute all-mode backtests
        run: PYTHONPATH=. python scripts/precompute_mode_backtest.py 2>&1 | grep -v "No runtime found\|streamlit run\|to view a Streamlit"
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/mode_backtest.json
          git diff --cached --quiet && { echo "No changes"; exit 0; }
          git commit -m "Update mode backtest data"
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep $((i * 5))
          done
          exit 1
