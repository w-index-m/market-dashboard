name: Update Tokyo real estate price index

on:
  schedule:
    - cron: "30 20 * * 1"   # 毎週月曜 20:30 UTC（火曜5:30 JST）。公表は月次なので週1回で十分
  workflow_dispatch: {}

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        run: pip install requests pandas openpyxl
      - name: Fetch MLIT price index (Tokyo, residential)
        run: python scripts/precompute_tokyo_re_index.py
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/tokyo_re_index.json
          git diff --cached --quiet && { echo "No changes"; exit 0; }
          git commit -m "Update Tokyo real estate price index data"
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep $((i * 5))
          done
          exit 1
