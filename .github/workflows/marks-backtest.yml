name: Backtest Marks-style selection rules (monthly)

on:
  schedule:
    - cron: "0 4 3 * *"   # 毎月3日 04:00 UTC
  workflow_dispatch: {}

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        run: pip install -q -r requirements.txt
      - name: Run point-in-time backtest (S&P500, quarterly)
        run: PYTHONPATH=. python scripts/precompute_marks_backtest.py 2>&1 | grep -v "No runtime found\|streamlit run\|to view a Streamlit"
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/marks_backtest.json
          git diff --cached --quiet && { echo "No changes"; exit 0; }
          git commit -m "Update Marks-style backtest data"
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep $((i * 5))
          done
          exit 1
