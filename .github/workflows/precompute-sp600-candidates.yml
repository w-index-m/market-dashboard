name: Precompute tenbagger candidates (S&P600 / TSE Standard)

on:
  schedule:
    - cron: "0 17 * * *"   # 17:00 UTC = 02:00 JST（翌日）。候補選定側の24hキャッシュに合わせ1日1回
  workflow_dispatch: {}

# S&P600（約600銘柄）と東証スタンダード小型株（約1,500銘柄）を同じランナーで続けて取得すると、
# Yahoo側のレート制限（HTTP 429）で後半がほぼ全滅することを確認したため、別ジョブ（別マシン）に分ける。
# 両ジョブがmainにpushするので、push前にrebaseし、競合時はリトライする。
jobs:
  sp600:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        run: pip install requests pandas openpyxl lxml yfinance
      - name: Precompute S&P600 (🌱長期育成)
        run: python scripts/precompute_sp600_candidates.py
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/sp600_candidates.json
          git diff --cached --quiet && { echo "No changes"; exit 0; }
          git commit -m "Update S&P600 tenbagger candidates data"
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep $((i * 5))
          done
          exit 1

  jp_standard:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        run: pip install pandas openpyxl xlrd yfinance
      - name: Precompute TSE Standard small caps (🚀日本株10倍株候補)
        run: python scripts/precompute_jp_tenbagger.py
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/jp_tenbagger_raw.json
          git diff --cached --quiet && { echo "No changes"; exit 0; }
          git commit -m "Update TSE Standard tenbagger raw data"
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep $((i * 5))
          done
          exit 1

  # 2つのデータ更新が終わった後、サイトで実際に数字が出る状態かを本番と同じコードで確認する。
  # 問題があればこのジョブを失敗させる（GitHubからリポジトリの持ち主に失敗通知が届く）。
  health_check:
    needs: [sp600, jp_standard]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        run: pip install -q -r requirements.txt
      - name: Check both tenbagger modes end-to-end
        id: check
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
        run: |
          set +e
          PYTHONPATH=. python scripts/check_tenbagger_health.py 2>/dev/null | tee /tmp/health.txt
          echo "code=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"
          cat /tmp/health.txt >> "$GITHUB_STEP_SUMMARY"
      # 実行ログ本体はこのリポジトリのアシスタントの作業環境から読めないため、結果をhealth-report
      # ブランチにも置く（毎回上書き、中身はこの結果ファイルだけ）
      - name: Publish report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout --orphan health-report
          git rm -rf --cached . >/dev/null
          { echo "Run: ${{ github.run_id }} (${{ github.event_name }})"; cat /tmp/health.txt; } > health_report.txt
          git add health_report.txt
          git commit -m "Health report from run ${{ github.run_id }}"
          git push origin health-report --force
      - name: Fail if unhealthy
        if: steps.check.outputs.code != '0'
        run: exit 1
