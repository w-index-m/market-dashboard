name: Precompute tenbagger candidates (S&P600 / TSE Standard)

on:
  schedule:
    - cron: "0 17 * * *"   # 17:00 UTC = 02:00 JST（翌日）。_fetch_tenbagger_candidates()の24hキャッシュに合わせ1日1回
  workflow_dispatch: {}

jobs:
  precompute:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install requests pandas openpyxl xlrd lxml yfinance

      # 片方が失敗しても、もう片方の結果は保存・コミットする（失敗した側は前日のファイルのまま）
      - name: Precompute S&P600 (🌱長期育成)
        continue-on-error: true
        run: python scripts/precompute_sp600_candidates.py

      - name: Precompute TSE Standard small caps (🚀日本株10倍株候補)
        continue-on-error: true
        run: python scripts/precompute_jp_tenbagger.py

      - name: Commit updated candidates file
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/sp600_candidates.json
          [ -f data/jp_tenbagger_raw.json ] && git add data/jp_tenbagger_raw.json
          git diff --cached --quiet && echo "No changes" || git commit -m "Update tenbagger candidates data (S&P600 / TSE Standard)"
          git push origin HEAD:main
