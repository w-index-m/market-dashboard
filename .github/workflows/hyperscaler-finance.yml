name: Hyperscaler finance (weekly)

on:
  schedule:
    - cron: "40 21 * * 0"   # 週1回（日曜）
  workflow_dispatch:

# 大手のCF・設備投資・債務を yfinance から集めて data/hyperscaler_finance.json に保存する（公開データのみ）。
jobs:
  run:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        run: pip install -q yfinance pandas
      - name: Collect
        run: python scripts/precompute_hyperscaler_finance.py --write
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/hyperscaler_finance.json
          git diff --cached --quiet && { echo "No changes"; exit 0; }
          git commit -m "Update hyperscaler finance"
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep $((i * 5))
          done
          exit 1
