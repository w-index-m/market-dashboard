name: Debug S&P600 fetch chain

on:
  workflow_dispatch: {}

jobs:
  debug:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install requests pandas openpyxl xlrd lxml yfinance beautifulsoup4 scikit-learn pytz

      - name: Run diagnostic
        run: |
          echo "=== JP tenbagger precompute (dry run) ===" | tee /tmp/debug_output.txt
          timeout 1200 python scripts/precompute_jp_tenbagger.py 2>&1 | grep -v "^HTTP Error\|possibly delisted" | tail -40 | tee -a /tmp/debug_output.txt
          ls -la data/jp_tenbagger_raw.json 2>&1 | tee -a /tmp/debug_output.txt
          python scripts/debug_sp600_fetch.py 2>&1 | tee -a /tmp/debug_output.txt
          echo "=== CPI fetch (FRED -> BLS fallback) ===" | tee -a /tmp/debug_output.txt
          python scripts/debug_cpi_fetch.py 2>&1 | tee -a /tmp/debug_output.txt
          echo "=== ML evaluation ===" | tee -a /tmp/debug_output.txt
          python scripts/debug_ml_eval.py 2>&1 | tee -a /tmp/debug_output.txt
          echo "=== Drawdown feature experiment ===" | tee -a /tmp/debug_output.txt
          python scripts/debug_dd_experiment.py 2>&1 | tee -a /tmp/debug_output.txt

      # Actions run logs are served from Azure Blob Storage, which the debugging
      # sandbox this repo's assistant runs in cannot reach (only github.com /
      # raw.githubusercontent.com are allowlisted there). Publish the plain-text
      # output to a dedicated non-main branch instead (force-pushed each run,
      # scratch data only) so it's readable over a raw.githubusercontent.com URL.
      - name: Publish output to debug-output branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout --orphan debug-output
          git rm -rf --cached . >/dev/null
          mkdir -p debug_output
          {
            echo "Run: ${{ github.run_id }} at $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "---"
            cat /tmp/debug_output.txt
          } > debug_output/sp600_fetch_result.txt
          git add debug_output/sp600_fetch_result.txt
          git commit -m "Debug output from run ${{ github.run_id }}"
          git push origin debug-output --force
