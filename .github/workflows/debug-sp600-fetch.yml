name: Debug S&P600 fetch chain

on:
  workflow_dispatch: {}

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install requests pandas openpyxl lxml yfinance

      - name: Run diagnostic
        run: python scripts/debug_sp600_fetch.py
