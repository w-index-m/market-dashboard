name: Debug S&P600 fetch chain

on:
  workflow_dispatch: {}

jobs:
  debug:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install requests pandas openpyxl xlrd lxml yfinance beautifulsoup4 scikit-learn pytz

      - name: Run diagnostic
        run: |
          python scripts/debug_sp600_fetch.py 2>&1 | tee /tmp/debug_output.txt
          echo "=== CPI fetch (FRED -> BLS fallback) ===" | tee -a /tmp/debug_output.txt
          python scripts/debug_cpi_fetch.py 2>&1 | tee -a /tmp/debug_output.txt
          echo "=== ML evaluation ===" | tee -a /tmp/debug_output.txt
          python scripts/debug_ml_eval.py 2>&1 | tee -a /tmp/debug_output.txt
          echo "=== Drawdown feature experiment ===" | tee -a /tmp/debug_output.txt
          python scripts/debug_dd_experiment.py 2>&1 | tee -a /tmp/debug_output.txt

      - name: JP tenbagger end-to-end (real app code + real AI)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          pip install -q -r requirements.txt
          echo "=== JP tenbagger end-to-end ===" | tee -a /tmp/debug_output.txt
          echo "=== OpenRouter diagnosis ===" | tee -a /tmp/debug_output.txt
          python scripts/debug_openrouter.py 2>&1 | tee -a /tmp/debug_output.txt
          echo "=== AI forecast grading test ===" | tee -a /tmp/debug_output.txt
          PYTHONPATH=. python scripts/debug_ai_forecast_grade.py 2>/dev/null | tee -a /tmp/debug_output.txt
          PYTHONPATH=. python scripts/debug_jp_tenbagger.py 2>&1 | grep -v "No runtime found\|to view a Streamlit app\|streamlit run\|Warning: to view" | tee -a /tmp/debug_output.txt

      # Actions run logs are served from Azure Blob Storage, which the debugging
      # sandbox this repo's assistant runs in cannot reach (only github.com /
      # raw.githubusercontent.com are allowlisted there). Publish the plain-text
      # output to a dedicated non-main branch instead (force-pushed each run,
      # scratch data only) so it's readable over a raw.githubusercontent.com URL.
      - name: Publish output to debug-output branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout --orphan debug-output
          git rm -rf --cached . >/dev/null
          mkdir -p debug_output
          {
            echo "Run: ${{ github.run_id }} at $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "---"
            cat /tmp/debug_output.txt
          } > debug_output/sp600_fetch_result.txt
          git add debug_output/sp600_fetch_result.txt
          git commit -m "Debug output from run ${{ github.run_id }}"
          git push origin debug-output --force
