name: CI (compile + lint)

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["main"]
  workflow_dispatch: {}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # app.py/analytics.pyの構文チェックのみが目的なので、requirements.txtの
      # 重い依存関係（scikit-learn/xgboost等）は不要。py_compileは標準ライブラリだけで動く。
      - name: Compile check (app.py / analytics.py)
        run: |
          python -m py_compile app.py analytics.py
          find scripts -name "*.py" -exec python -m py_compile {} +

      - name: Install ruff
        run: pip install ruff==0.15.8

      - name: Lint (ruff)
        run: ruff check .
